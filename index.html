<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Redaction+10:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <div class="title">Login form</div>
        <form action="#">
            <div class="field">
                <input type="text" required id="email" >
                <label for="email">Email Address</label>
            </div>
            <div class="field">
                <input type="password" required id="pass">
                <label for="pass">Password</label>
            </div>
            <div class="forgot"><a href="#">Forgor Password?</a></div>
            <div class="field">
                <input type="submit" value="Login">
            </div>
            <div class="sign-up">
                Not a member?<a href="#">Signup now</a>
            </div>
        </form>
    </div>

</body>

</html>
